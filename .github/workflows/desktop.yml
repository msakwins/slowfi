# Application desktop : installateurs Windows, macOS et Linux.
#
# - À chaque version (tag v0.1.0, v0.2.0…), les trois installateurs sont
#   construits et joints à une release GitHub publiée d'office. Pas de
#   brouillon : une release publiée avant la fin de la build macOS (la plus
#   lente) refusait son installateur.
# - Lancement manuel possible (onglet Actions) : les installateurs restent
#   alors en artefacts du workflow, sans release.
name: Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:run
      - run: npm run build
        env:
          # Identifiant Amazon Partenaires (variable du dépôt, publique) : vide,
          # les liens restent de simples recherches.
          VITE_AMAZON_TAG: ${{ vars.VITE_AMAZON_TAG }}

      # Vérification de l'application : la page s'affiche, une lecture passe
      # par le shell, et l'analyse du matériel rend un verdict.
      # L'application s'arrête d'elle-même au bout de 4 minutes ; ce plafond
      # couvre le cas où elle ne démarrerait même pas.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: xvfb-run -a npx electron . --smoke --no-sandbox
      - name: Smoke test
        if: runner.os != 'Linux'
        timeout-minutes: 10
        run: npx electron . --smoke

      - name: Installateurs
        run: npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/') && 'always' || 'never' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pas encore de certificat de signature.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: slowfi-${{ runner.os }}
          path: |
            release/*.exe
            release/squirrel-windows/*
            release/*.dmg
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
